<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CueVault · 提示词库</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f7f6f3;
    --surface:#ffffff;
    --subtle:#e8e6e0;
    --hover:#e6e4dc;
    --text:#1c1c1a;
    --secondary:#4a4944;
    --tertiary:#6e6c66;
    --line:#e4e2db;
    --line-strong:#d4d1c8;
    --accent:#23483d;
    --accent-soft:#e5eeea;
    --danger:#9d3434;
    --star:#8a5e28;
    --btn-bg:#23483d;
    --btn-fg:#f6f5f1;
    --btn-bg-hover:#1a3830;
    --shadow:0 18px 50px rgba(28,28,26,.14);
    --radius:6px;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#131311;
    --surface:#1c1c1a;
    --subtle:#2a2a27;
    --hover:#242422;
    --text:#f4f3ef;
    --secondary:#c9c7bf;
    --tertiary:#9c9a92;
    --line:#31312d;
    --line-strong:#3c3c37;
    --accent:#9ec7b6;
    --accent-soft:#24312c;
    --danger:#f0aaaa;
    --star:#e0b56a;
    --btn-bg:#f3f2ee;
    --btn-fg:#1b1b19;
    --btn-bg-hover:#e4e2db;
    --shadow:0 18px 50px rgba(0,0,0,.46);
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100%;
    margin:0;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.5;
    background:var(--bg);
    color:var(--text);
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    transition:background-color .16s ease,color .16s ease;
  }
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0;user-select:none}
  [hidden]{display:none !important}
  :focus{outline:none}
  :focus-visible{
    outline:2px solid color-mix(in srgb,var(--accent) 72%,transparent);
    outline-offset:2px;
  }
  ::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  input::placeholder,textarea::placeholder{color:var(--tertiary)}

  .app{
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    align-items:start;
  }
  .sidebar,.main,.category-list,.prompt-grid{min-width:0}

  .sidebar{
    position:sticky;
    top:0;
    height:100vh;
    height:100dvh;
    max-height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:var(--surface);
    border-right:1px solid var(--line);
  }
  .brand{
    padding:18px 16px 6px;
  }
  .brand strong{
    font-size:15px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .nav-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    padding:0 10px 0 16px;
    height:28px;
    font-size:13px;
    font-weight:600;
    color:var(--secondary);
  }
  .nav-actions{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .category-action-btn{
    width:24px;
    height:24px;
    border-radius:var(--radius);
    color:var(--secondary);
    display:grid;
    place-items:center;
    transition:background-color .12s ease,color .12s ease;
  }
  .category-action-btn svg{width:14px;height:14px}
  .category-action-btn:hover{background:var(--hover);color:var(--text)}
  .category-action-btn.is-active{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .category-add{
    width:24px;
    height:24px;
    border-radius:var(--radius);
    color:var(--secondary);
    display:grid;
    place-items:center;
  }
  .category-add svg{width:14px;height:14px}
  .category-add:hover{background:var(--hover);color:var(--text)}
  .category-list{
    flex:1;
    min-height:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:4px 8px 8px;
    scrollbar-width:thin;
    scrollbar-color:var(--line-strong) transparent;
  }
  .category-btn{
    width:100%;
    height:32px;
    padding:0 8px;
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    text-align:left;
    font-size:13px;
    color:var(--secondary);
    transition:background-color .12s ease,color .12s ease;
  }
  .category-btn > span:first-child{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .category-btn:hover{background:var(--hover);color:var(--text)}
  .category-btn.active{
    background:var(--subtle);
    color:var(--text);
    font-weight:600;
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .count{
    flex:0 0 auto;
    font-size:13px;
    font-variant-numeric:tabular-nums;
    color:var(--secondary);
  }
  .category-btn.active .count{color:var(--text)}
  .cat-side{display:flex;align-items:center;gap:3px;flex:0 0 auto}
  .cat-x{
    width:18px;
    height:18px;
    display:grid;
    place-items:center;
    border-radius:4px;
    color:var(--tertiary);
    font-size:13px;
    line-height:1;
    cursor:pointer;
  }
  .cat-x:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
  .cat-drag{
    width:20px;
    height:20px;
    display:grid;
    place-items:center;
    border-radius:4px;
    color:var(--tertiary);
    cursor:grab;
    touch-action:none;
    user-select:none;
  }
  .cat-drag:hover{background:var(--hover);color:var(--text)}
  .cat-drag:active{cursor:grabbing}
  .cat-drag svg{width:13px;height:13px;pointer-events:none}
  .category-btn.is-editing-item{
    user-select:none;
    position:relative;
  }
  .category-btn.is-dragging{
    opacity:0.35 !important;
    background:var(--hover) !important;
  }
  .category-btn.drag-over-top{
    position:relative;
    background:var(--subtle);
  }
  .category-btn.drag-over-top::before{
    content:"";
    position:absolute;
    left:4px;
    right:4px;
    top:-2px;
    height:3px;
    background:var(--accent);
    border-radius:2px;
    z-index:10;
  }
  .category-btn.drag-over-bottom{
    position:relative;
    background:var(--subtle);
  }
  .category-btn.drag-over-bottom::after{
    content:"";
    position:absolute;
    left:4px;
    right:4px;
    bottom:-2px;
    height:3px;
    background:var(--accent);
    border-radius:2px;
    z-index:10;
  }
  .sidebar-footer{
    margin-top:auto;
    border-top:1px solid var(--line);
    padding:12px;
  }
  .appearance{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .appearance-label{font-size:13px}
  .theme-btn{
    height:28px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    font-size:13px;
    color:var(--text);
  }
  .theme-btn:hover{background:var(--hover)}

  .main{
    min-width:0;
    width:100%;
    padding:28px 32px 64px;
    overflow:visible;
  }
  .page-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
  }
  .page-head h1{
    margin:0;
    font-size:22px;
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1.25;
  }
  .page-head p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--secondary);
  }
  .primary-btn,.save-inline{
    height:32px;
    padding:0 12px;
    border-radius:var(--radius);
    background:var(--btn-bg);
    color:var(--btn-fg);
    font-size:13px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    transition:background-color .12s ease;
  }
  .primary-btn svg{width:14px;height:14px}
  .primary-btn:hover,.save-inline:hover{background:var(--btn-bg-hover)}
  .primary-btn:active,.save-inline:active{background:var(--btn-bg-hover)}

  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding-bottom:12px;
    margin-bottom:4px;
  }
  .search-wrap{
    position:relative;
    flex:0 1 280px;
    min-width:180px;
  }
  .search-ico{
    position:absolute;
    left:9px;
    top:50%;
    width:15px;
    height:15px;
    transform:translateY(-50%);
    color:var(--tertiary);
    pointer-events:none;
  }
  .search-wrap input{
    width:100%;
    height:32px;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius);
    padding:0 64px 0 30px;
  }
  .kbd{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    font-size:11px;
    line-height:1.4;
    color:var(--tertiary);
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:4px;
    padding:1px 4px;
    pointer-events:none;
  }
  .toolbar-sep{
    width:1px;
    height:16px;
    background:var(--line);
    flex:0 0 auto;
  }
  .toolbar-spacer{flex:1 1 auto}
  .text-btn{
    height:32px;
    padding:0 8px;
    border-radius:var(--radius);
    font-size:13px;
    color:var(--secondary);
    transition:background-color .12s ease,color .12s ease;
  }
  .text-btn:hover{background:var(--hover);color:var(--text)}
  .filter-btn{
    height:32px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    font-size:13px;
    color:var(--secondary);
    transition:background-color .12s ease,color .12s ease,border-color .12s ease;
  }
  .filter-btn:hover{color:var(--text)}
  .filter-btn.is-active{
    background:var(--subtle);
    border-color:var(--line-strong);
    color:var(--text);
    font-weight:600;
  }

  .segmented{
    display:inline-flex;
    align-items:stretch;
    height:32px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    overflow:hidden;
  }
  .segmented button{
    padding:0 10px;
    font-size:13px;
    color:var(--secondary);
    transition:background-color .12s ease,color .12s ease;
  }
  .segmented button + button{box-shadow:inset 1px 0 0 var(--line)}
  .segmented button:hover{background:var(--hover);color:var(--text)}
  .segmented button.is-active{
    background:var(--subtle);
    color:var(--text);
    font-weight:600;
  }
  .segmented button:focus-visible{outline-offset:-2px;z-index:1}


  .prompt-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:12px;
    align-items:stretch;
  }
  .prompt-card{
    position:relative;
    margin:0;
    min-height:max(148px,min-content);
    height:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:14px 14px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface);
    text-align:left;
    cursor:pointer;
    color:inherit;
    user-select:auto;
    transition:border-color .12s ease,transform .12s ease,box-shadow .12s ease;
  }
  .prompt-card::before{
    content:"";
    position:absolute;
    left:0;top:10px;bottom:10px;
    width:2px;
    border-radius:2px;
    background:transparent;
    transition:background-color .12s ease;
  }
  .prompt-card:hover{
    border-color:var(--line-strong);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(28,28,26,.08);
  }
  .prompt-card:hover::before{background:var(--accent)}
  .prompt-card:focus-visible{outline-offset:2px}
  .card-head{
    flex:0 0 auto;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .card-title{
    margin:0;
    min-width:0;
    font-size:15px;
    font-weight:600;
    line-height:1.4;
    max-height:calc(1.4em * 2);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-copy{
    width:28px;
    height:28px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    color:var(--tertiary);
    transition:background-color .12s ease,color .12s ease;
  }
  .card-copy svg{width:15px;height:15px}
  .card-copy:hover{
    background:var(--hover);
    color:var(--text);
  }
  .preview{
    margin:0;
    flex:0 0 auto;
    height:4.5em;
    max-height:4.5em;
    font-size:13px;
    line-height:1.5;
    color:var(--secondary);
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    min-width:0;
    flex:0 0 auto;
    margin-top:auto;
  }
  .tag{
    flex:0 0 auto;
    max-width:100%;
    padding:2px 7px;
    border-radius:999px;
    background:var(--bg);
    color:var(--secondary);
    font-size:12px;
    line-height:1.5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .prompt-card .fav{
    margin-left:auto;
    width:28px;
    height:28px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    color:var(--tertiary);
  }
  .prompt-card .fav svg{width:15px;height:15px}
  .prompt-card .fav:hover{background:var(--hover);color:var(--text)}
  .fav.on,.prompt-card:hover .fav.on{color:var(--star)}
  .fav svg path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
  .fav.on svg path{fill:currentColor}
  [data-theme="dark"] .prompt-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.28)}

  .empty{
    grid-column:1 / -1;
    padding:72px 16px;
    text-align:center;
  }
  .empty-title{
    margin:0;
    font-size:15px;
    font-weight:600;
  }
  .empty-hint{
    margin:6px 0 0;
    font-size:13px;
    color:var(--secondary);
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,20,18,.46);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
  }
  .overlay.open{display:flex;animation:fade .14s ease}
  .modal{
    width:min(760px,calc(100vw - 48px));
    max-height:min(720px,calc(100vh - 48px));
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .overlay.open .modal{animation:rise .16s cubic-bezier(.2,.8,.2,1)}
  .modal-head{
    min-height:56px;
    padding:8px 10px 8px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .modal-head-left{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .header-title-input{
    flex:1 1 auto;
    min-width:0;
    height:36px;
    border:0;
    background:transparent;
    font-size:18px;
    font-weight:600;
    letter-spacing:-.02em;
    padding:0;
  }
  .modal.is-editing .header-title-input{
    box-shadow:inset 0 -1px 0 var(--line);
  }
  .modal.is-editing .header-title-input:focus{
    box-shadow:inset 0 -1px 0 var(--accent);
  }
  .header-category{
    flex:0 0 132px;
    height:32px;
    border:1px solid transparent;
    border-radius:var(--radius);
    background:transparent;
    padding:0 8px;
    font-size:13px;
    color:var(--secondary);
  }
  .header-category:not(:disabled){
    border-color:var(--line);
    background:var(--surface);
    color:var(--text);
  }
  .header-category:disabled{
    opacity:1;
    appearance:none;
    pointer-events:none;
  }
  .modal-actions{display:flex;align-items:center;gap:2px}
  .action-sep{
    width:1px;
    height:16px;
    background:var(--line);
    margin:0 4px;
  }
  .icon-btn{
    width:32px;
    height:32px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    color:var(--secondary);
    transition:background-color .12s ease,color .12s ease;
  }
  .icon-btn svg{width:16px;height:16px}
  .icon-btn:hover{background:var(--hover);color:var(--text)}
  .icon-btn.danger-icon:hover{
    background:color-mix(in srgb,var(--danger) 10%,transparent);
    color:var(--danger);
  }
  .mode-btn{
    width:auto;
    padding:0 10px;
    font-size:13px;
    font-weight:600;
  }
  .icon-btn.mode-btn.active{
    background:var(--accent-soft);
    color:var(--accent);
  }

  .modal-body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }
  .content-toolbar{
    height:42px;
    display:flex;
    align-items:stretch;
    gap:4px;
    padding:0 10px 0 4px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .variant-tabs{
    display:flex;
    align-items:stretch;
    min-width:0;
    overflow-x:auto;
    overflow-y:hidden;
    margin-bottom:-1px;
    scrollbar-width:none;
  }
  .variant-tabs::-webkit-scrollbar{display:none}
  .variant-chip{
    position:relative;
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:0 12px;
    border-bottom:2px solid transparent;
    background:transparent;
    color:var(--secondary);
    font-size:13px;
    white-space:nowrap;
    transition:color .12s ease,border-color .12s ease;
  }
  .variant-chip:hover{color:var(--text)}
  .variant-chip.active{
    color:var(--text);
    font-weight:600;
    border-bottom-color:var(--accent);
  }
  .variant-chip-x{
    width:16px;
    height:16px;
    display:grid;
    place-items:center;
    border-radius:4px;
    color:var(--tertiary);
    font-size:13px;
    line-height:1;
    opacity:0;
  }
  .variant-chip:hover .variant-chip-x,
  .variant-chip.active .variant-chip-x{opacity:1}
  .variant-chip-x:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
  .variant-add,.copy-inline{
    align-self:center;
    width:28px;
    height:28px;
    display:grid;
    place-items:center;
    border-radius:var(--radius);
    color:var(--secondary);
    transition:background-color .12s ease,color .12s ease;
  }
  .variant-add svg,.copy-inline svg{width:15px;height:15px}
  .variant-add:hover,.copy-inline:hover{background:var(--hover);color:var(--text)}
  .content-toolbar .toolbar-spacer{align-self:center}
  .content-toolbar .save-inline{align-self:center;height:28px}
  .prompt-editor{
    flex:1 1 auto;
    width:100%;
    height:320px;
    max-height:calc(100vh - 220px);
    min-height:220px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:var(--text);
    padding:18px 22px 24px;
    font-size:15px;
    line-height:1.7;
    tab-size:2;
    overflow:auto;
  }
  .prompt-editor:focus,.prompt-editor:focus-visible{outline:none;box-shadow:none}

  .status{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(8px);
    background:#1c1c1a;
    color:#f6f5f1;
    padding:8px 12px;
    border-radius:var(--radius);
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;
    z-index:150;
    box-shadow:0 8px 24px rgba(28,28,26,.16);
  }
  [data-theme="dark"] .status{background:#f4f3ef;color:#1c1c1a}
  .status.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .app-dialog-overlay{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(20,20,18,.46);
  }
  .app-dialog-overlay.open{display:flex;animation:fade .14s ease}
  .app-dialog{
    width:min(400px,92vw);
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    box-shadow:var(--shadow);
    padding:20px;
  }

function makeId(){
  return crypto.randomUUID ? crypto.randomUUID() : 'id_'+Date.now()+'_'+Math.random().toString(16).slice(2);
}
function normalizePrompt(p){
  const prompt={...p};
  prompt.id = String(prompt.id || makeId()).trim() || makeId();
  prompt.title = String(prompt.title || '未命名提示词').trim() || '未命名提示词';
  prompt.categoryId = String(prompt.categoryId || '');
  prompt.favorite = !!prompt.favorite;
  prompt.useCount = Number(prompt.useCount) || 0;
  prompt.createdAt = Number(prompt.createdAt) || Date.now();
  prompt.updatedAt = Number(prompt.updatedAt) || Date.now();
  if(!Array.isArray(prompt.variants) || !prompt.variants.length){
    prompt.variants=[{
      id:makeId(),
      name:'默认',
      content:typeof prompt.content==='string'?prompt.content:''
    }];
  }
  prompt.variants=prompt.variants.map((v,i)=>({
    id:String(v.id || makeId()).trim() || makeId(),
    name:String(v.name || `提示词 ${i+1}`).trim() || `提示词 ${i+1}`,
    content:typeof v.content==='string'?v.content:''
  }));
  delete prompt.content;
  prompt.tags=Array.isArray(prompt.tags)
    ? [...new Set(prompt.tags.filter(t=>typeof t==='string').map(t=>t.trim()).filter(Boolean))]
    : [];
  delete prompt.description;
  return prompt;
}
function normalizeCategory(c, index){
  const id=String(c?.id || ('cat_' + index)).trim() || ('cat_' + index);
  return {
    id,
    name: String(c?.name || '未命名分类').trim() || '未命名分类',
    system: id==='all' ? true : !!c?.system
  };
}
function ensureAllCategory(categories){
  const all=categories.find(c=>c.id==='all');
  if(all){
    all.system=true;
    if(!String(all.name||'').trim()) all.name='全部';
    return categories;
  }
  categories.unshift({id:'all',name:'全部',system:true});
  return categories;
}
function normalizeState(data){
  const rawCats = Array.isArray(data?.categories) && data.categories.length ? data.categories : structuredClone(seedData.categories);
  return {
    categories: ensureAllCategory(rawCats.map(normalizeCategory)),
    prompts: Array.isArray(data?.prompts) ? data.prompts.map(normalizePrompt) : []
  };
}
function validateLibrary(data){
  const seen=new Set();
  for(const cat of data?.categories||[]){
    const id=String(cat?.id||'').trim();
    if(!id||id!==String(cat.id)) return '存在空的分类编号，已停止保存';
    if(seen.has('c:'+id)) return '分类编号重复，已停止保存';
    seen.add('c:'+id);
  }
  for(const prompt of data?.prompts||[]){
    const id=String(prompt?.id||'').trim();
    if(!id||id!==String(prompt.id)) return '存在空的提示词编号，已停止保存';
    if(seen.has('p:'+id)) return '提示词编号重复，已停止保存';
    seen.add('p:'+id);
    for(const variant of prompt.variants||[]){
      const vid=String(variant?.id||'').trim();
      if(!vid||vid!==String(variant.id)) return '存在空的场景编号，已停止保存';
      if(seen.has('v:'+vid)) return '场景编号重复，已停止保存';
      seen.add('v:'+vid);
    }
  }
  return '';
}
function normalizeImport(data){
  if(!data||typeof data!=='object'||Array.isArray(data)){
    return {error:'所选文件不是提示词库备份。'};
  }
  const hasCats=Array.isArray(data.categories);
  const hasPrompts=Array.isArray(data.prompts);
  if(!hasCats&&!hasPrompts) return {error:'未在文件中检测到提示词或分类。'};
  const categories=ensureAllCategory((hasCats?data.categories:[]).map(normalizeCategory));
  const prompts=(hasPrompts?data.prompts:[]).map(normalizePrompt);
  const realCats=categories.filter(c=>c.id!=='all');
  if(!prompts.length&&!realCats.length) return {error:'文件里没有可导入的提示词或分类。'};
  const problem=validateLibrary({categories,prompts});
  if(problem) return {error:problem};
  return {categories,prompts,keepCategories:!hasCats};
}
function debounce(fn, delay = 150){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), delay);
  };
}
function isDesktop(){
  return !!(window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke);
}
function invoke(cmd,args){
  const fn=window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
  return fn(cmd,args||{});
}
function readStoredLibrary(){
  let readError=null;
  for(const key of [STORAGE_KEY,'prompt_library_v6','prompt_library_v5','prompt_library_v4','prompt_library_v3','prompt_library_v1']){
    try{
      const raw=localStorage.getItem(key);
      if(raw===null) continue;
      const parsed=JSON.parse(raw);
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)
        ||!Array.isArray(parsed.categories)||!Array.isArray(parsed.prompts)){
        throw new Error('提示词库格式无效');
      }
      const loaded=normalizeState(parsed);
      const problem=validateLibrary(loaded);
      if(problem) throw new Error(problem);
      // 读取与迁移不覆盖原始存储；用户下一次明确保存时再写入当前版本。
      if(readError) showToast('当前数据读取失败，已读取旧版数据；原始存储已保留',4000);
      return loaded;
    }catch(e){
      readError=e;
    }
  }
  if(readError) throw readError;
  return null;
}
function loadBrowserData(){
  const stored=readStoredLibrary();
  if(stored) return stored;
  const fresh=structuredClone(seedData);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(fresh));
  return fresh;
}
function libraryFromRemote(remote){
  return {
    categories:ensureAllCategory(Array.isArray(remote?.categories)?remote.categories.map(normalizeCategory):[]),
    prompts:Array.isArray(remote?.prompts)?remote.prompts.map(normalizePrompt):[]
  };
}
function remoteHasLibrary(remote){
  return !!(remote?.seeded
    || (Array.isArray(remote?.prompts)&&remote.prompts.length)
    || (Array.isArray(remote?.categories)&&remote.categories.length));
}
async function loadData(){
  if(!isDesktop()) return loadBrowserData();
  const remote=await invoke('load_state');
  if(remoteHasLibrary(remote)){
    const loaded=libraryFromRemote(remote);
    if(!remote.seeded){
      try{ await invoke('save_state',{state:loaded}); }catch(e){}
    }
    return loaded;
  }
  const migrated=readStoredLibrary();
  const fresh=migrated||structuredClone(seedData);
  await invoke('save_state',{state:fresh});
  return fresh;
}
let persistEnabled=true;
let saveQueue=Promise.resolve();
let isEditingCategories=false;
let categorySnapshot=null;
let categoryViewSnapshot='all';
let detachedPromptCategories=new Map();
let categoryEditDirty=false;
function stateForSave(commitCategoryEdit){
  const snapshot=structuredClone(state);
  if(commitCategoryEdit||!isEditingCategories||!categorySnapshot) return snapshot;
  snapshot.categories=structuredClone(categorySnapshot);
  const valid=new Set(snapshot.categories.map(c=>c.id));
  for(const prompt of snapshot.prompts){
    if(detachedPromptCategories.has(prompt.id)) prompt.categoryId=detachedPromptCategories.get(prompt.id);
    if(prompt.categoryId&&!valid.has(prompt.categoryId)) prompt.categoryId='';
  }
  return snapshot;
}
function saveData(options){
  if(!persistEnabled){
    showToast('读取失败，未写入数据库');
    return Promise.reject(new Error('persist disabled'));
  }
  const snapshot=stateForSave(!!options?.commitCategoryEdit);
  const problem=validateLibrary(snapshot);
  if(problem){
    showToast(problem);
    return Promise.reject(new Error(problem));
  }
  if(!isDesktop()){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot));
      return Promise.resolve(true);
    }catch(e){
      showToast('保存失败');
      return Promise.reject(e);
    }
  }
  const job=saveQueue.then(()=>invoke('save_state',{state:snapshot}));
  saveQueue=job.then(()=>{},()=>{});
  return job.catch(err=>{
    showToast('保存失败');
    throw err;
  });
}
function getCategory(id){
  return state.categories.find(c=>c.id===id);
}
function getPrimaryContent(prompt){
  return prompt?.variants?.[0]?.content || '';
}
function getAllContent(prompt){
  return (prompt?.variants||[]).map(v=>`${v.name} ${v.content}`).join(' ');
}
function countUncategorized(){
  return state.prompts.filter(p=>!p.categoryId || !state.categories.some(c=>c.id===p.categoryId)).length;
}
function countByCategory(id){
  if(id==='all') return state.prompts.length;
  if(id==='__uncategorized__') return countUncategorized();
  return state.prompts.filter(p=>p.categoryId===id).length;
}
function escapeHtml(str=''){
  return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function copyText(text){

  }catch(e){
    const ta=document.createElement('textarea');

function renderCategories(){
  els.categoryList.innerHTML='';
  state.categories.forEach(cat=>{
    const btn=document.createElement('div');
    btn.setAttribute('role','button');
    btn.tabIndex=0;
    btn.className='category-btn'+(currentCategory===cat.id?' active':'');

    if(!isEditingCategories){
      btn.innerHTML=`<span>${escapeHtml(cat.name)}</span><span class="cat-side"><span class="count">${countByCategory(cat.id)}</span></span>`;
      btn.onclick=()=>{currentCategory=cat.id;renderAll();};
      btn.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();btn.click();}};
    }else{
      btn.classList.add('is-editing-item');
      if(cat.system||cat.id==='all'){
        btn.innerHTML=`<span>${escapeHtml(cat.name)}</span><span class="cat-side"><span class="count">${countByCategory(cat.id)}</span></span>`;
      }else{
        btn.dataset.sortable='true';
        btn.dataset.id=cat.id;
        btn.innerHTML=`<span class="cat-name" title="点击重命名分类" style="cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(cat.name)}</span><span class="cat-side"><span class="cat-x" title="删除分类" role="button" tabindex="0" aria-label="删除分类 ${escapeHtml(cat.name)}">×</span><span class="cat-drag" title="按住上下拖拽排序" aria-label="拖拽排序">${DRAG_ICON}</span></span>`;

        const nameHit=btn.querySelector('.cat-name');
        if(nameHit){
          nameHit.onclick=async(e)=>{
            e.stopPropagation();
            e.preventDefault();
            const newName=await askText('修改分类名称',cat.name);
            if(newName&&newName.trim()&&newName.trim()!==cat.name){
              cat.name=newName.trim();
              categoryEditDirty=true;
              renderAll();
              showToast('已修改分类名称');
            }
          };
        }

        const removeHit=btn.querySelector('.cat-x');
        if(removeHit){
          removeHit.onclick=(e)=>{
            e.stopPropagation();
            e.preventDefault();
            deleteCategory(cat);
          };
          removeHit.onkeydown=(e)=>{
            if(e.key==='Enter'||e.key===' '){
              e.stopPropagation();
              e.preventDefault();
              deleteCategory(cat);
            }
          };
        }

        const dragHandle=btn.querySelector('.cat-drag');
        if(dragHandle){
          dragHandle.onpointerdown=(e)=>{
            if(e.button!==0 && e.pointerType==='mouse') return;
            e.preventDefault();
            e.stopPropagation();

            const fromId=cat.id;
            const startY=e.clientY;
            let isDragging=false;
            let currentDropTarget=null;
            let currentIsBottom=false;

            try{ dragHandle.setPointerCapture(e.pointerId); }catch(_){}

            const onPointerMove=(moveEv)=>{
              const dist=Math.abs(moveEv.clientY - startY);
              if(!isDragging && dist < 3) return;

              if(!isDragging){
                isDragging=true;
                btn.classList.add('is-dragging');
                document.body.style.cursor='grabbing';
              }

              const listItems=Array.from(els.categoryList.querySelectorAll('.category-btn[data-sortable="true"]'));
              listItems.forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));

              let found=null;
              let isBottom=false;

              for(const item of listItems){
                const rect=item.getBoundingClientRect();
                if(moveEv.clientY>=rect.top && moveEv.clientY<=rect.bottom){
                  found=item;
                  isBottom=moveEv.clientY > (rect.top + rect.height/2);
                  break;
                }
              }

              if(!found && listItems.length>0){
                const firstRect=listItems[0].getBoundingClientRect();
                const lastRect=listItems[listItems.length-1].getBoundingClientRect();
                if(moveEv.clientY < firstRect.top){
                  found=listItems[0];
                  isBottom=false;
                }else if(moveEv.clientY > lastRect.bottom){
                  found=listItems[listItems.length-1];
                  isBottom=true;
                }
              }

              currentDropTarget=found;
              currentIsBottom=isBottom;

              if(found && found.dataset.id!==fromId){
                found.classList.add(isBottom ? 'drag-over-bottom' : 'drag-over-top');
              }
            };

            const onPointerUp=(upEv)=>{
              dragHandle.removeEventListener('pointermove', onPointerMove);
              dragHandle.removeEventListener('pointerup', onPointerUp);
              dragHandle.removeEventListener('pointercancel', onPointerUp);
              try{ dragHandle.releasePointerCapture(upEv.pointerId); }catch(_){}

              document.body.style.cursor='';
              btn.classList.remove('is-dragging');
              document.querySelectorAll('.category-btn').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));

              if(!isDragging || !currentDropTarget) return;

              const targetId=currentDropTarget.dataset.id;
              if(!targetId || targetId===fromId) return;

              const fromIdx=state.categories.findIndex(c=>c.id===fromId);
              let toIdx=state.categories.findIndex(c=>c.id===targetId);
              if(fromIdx===-1 || toIdx===-1) return;

              if(currentIsBottom){
                toIdx=fromIdx<toIdx ? toIdx : toIdx+1;
              }else{
                toIdx=fromIdx<toIdx ? toIdx-1 : toIdx;
              }
              toIdx=Math.max(1, Math.min(state.categories.length-1, toIdx));

              const [moved]=state.categories.splice(fromIdx,1);
              state.categories.splice(toIdx,0,moved);
              categoryEditDirty=true;
              renderCategories();
            };

            dragHandle.addEventListener('pointermove', onPointerMove);
            dragHandle.addEventListener('pointerup', onPointerUp);
            dragHandle.addEventListener('pointercancel', onPointerUp);
          };
        }
      }
    }
    els.categoryList.appendChild(btn);
  });

  const uncatCount=countUncategorized();
  if(uncatCount>0){
    const uncatBtn=document.createElement('div');
    uncatBtn.setAttribute('role','button');
    uncatBtn.tabIndex=0;
    uncatBtn.className='category-btn'+(currentCategory==='__uncategorized__'?' active':'');
    uncatBtn.innerHTML=`<span>未分类</span><span class="cat-side"><span class="count">${uncatCount}</span></span>`;
    uncatBtn.onclick=()=>{currentCategory='__uncategorized__';renderAll();};
    uncatBtn.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();uncatBtn.click();}};
    els.categoryList.appendChild(uncatBtn);
  }
}

async function deleteCategory(cat){
  if(!cat||cat.system||cat.id==='all'||cat.id==='__uncategorized__') return;
  const n=countByCategory(cat.id);
  const message=n
    ? `确定删除分类「${cat.name}」吗？\n其中 ${n} 条提示词会保留，并改为未分类。`
    : `确定删除分类「${cat.name}」吗？`;
  const ok=await askConfirm('删除分类',message,'删除',true);
  if(!ok) return;
  state.categories=state.categories.filter(c=>c.id!==cat.id);
  state.prompts.forEach(p=>{
    if(p.categoryId===cat.id){
      if(!detachedPromptCategories.has(p.id)) detachedPromptCategories.set(p.id,p.categoryId);
      p.categoryId='';
    }
  });
  if(temporaryPrompt){
    commitEditor();
    temporaryPrompt.title=els.titleInput.value;
    if(temporaryPrompt.categoryId===cat.id){
      if(!detachedPromptCategories.has(temporaryPrompt.id)) detachedPromptCategories.set(temporaryPrompt.id,temporaryPrompt.categoryId);
      temporaryPrompt.categoryId='';
    }
  }
  if(currentCategory===cat.id) currentCategory='all';
  categoryEditDirty=true;
  renderAll();
  if(temporaryPrompt) syncModal();
  showToast('已删除分类');
}
function visibleQueryKey(){
  return [currentCategory, favoriteOnly?'1':'0', sortMode, els.searchInput.value].join('\0');
}
function paginateItems(items, page, pageSize){
  const size=pageSize>0?pageSize:20;
  const pages=Math.max(1, Math.ceil(items.length/size));
  const current=Math.min(Math.max(page||1, 1), pages);
  const start=(current-1)*size;
  return {page:current, pages, items:items.slice(start, start+size)};
}
function renderPager(total, page, pages){
  if(!els.promptPager) return;
  if(total<=PAGE_SIZE){
    els.promptPager.hidden=true;
    els.promptPager.replaceChildren();
    return;
  }
  els.promptPager.hidden=false;
  els.promptPager.replaceChildren();
  const status=document.createElement('span');
  status.className='pager-status';
  const from=(page-1)*PAGE_SIZE+1;
  const to=Math.min(page*PAGE_SIZE, total);
  status.textContent=`${from}–${to} / ${total}`;
  els.promptPager.appendChild(status);
  const add=(label, target, opts={})=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='pager-btn'+(opts.current?' is-active':'');
    btn.textContent=label;
    if(opts.current) btn.setAttribute('aria-current','page');
    if(opts.label) btn.setAttribute('aria-label', opts.label);
    if(opts.disabled){
      btn.disabled=true;
    }else if(!opts.current){
      btn.onclick=()=>{
        currentPage=target;
        renderPrompts();
        window.scrollTo(0,0);
      };
    }
    els.promptPager.appendChild(btn);
  };
  add('上一页', page-1, {disabled:page<=1, label:'上一页'});
  for(let i=1;i<=pages;i++) add(String(i), i, {current:i===page, label:`第 ${i} 页`});
  add('下一页', page+1, {disabled:page>=pages, label:'下一页'});
}
function getVisiblePrompts(){
  const q=els.searchInput.value.trim().toLowerCase();
  let items=state.prompts.filter(p=>{
    const cat=getCategory(p.categoryId)?.name||'';
    const text=[p.title,getAllContent(p),cat,...(p.tags||[])].join(' ').toLowerCase();
    const inCat=currentCategory==='all'
      ? true
      : currentCategory==='__uncategorized__'
        ? (!p.categoryId || !state.categories.some(c=>c.id===p.categoryId))
        : p.categoryId===currentCategory;
    const favOk=!favoriteOnly||p.favorite;
    return inCat && favOk && (!q||text.includes(q));
  });
  items.sort((a,b)=>(b[sortMode]||0)-(a[sortMode]||0));
  return items;
}
function renderPrompts(){
  const key=visibleQueryKey();
  if(key!==listQueryKey){
    listQueryKey=key;
    currentPage=1;
  }
  const items=getVisiblePrompts();
  const view=paginateItems(items, currentPage, PAGE_SIZE);
  currentPage=view.page;
  els.promptGrid.innerHTML='';
  const catName=currentCategory==='all'
    ? '全部提示词'
    : currentCategory==='__uncategorized__'
      ? '未分类提示词'
      : (getCategory(currentCategory)?.name||'提示词');
  els.pageTitle.textContent=catName;
  els.pageSubtitle.textContent=favoriteOnly ? `${items.length} 条收藏` : `${items.length} 条`;

  if(!items.length){
    els.promptGrid.innerHTML=`<div class="empty"><p class="empty-title">没有匹配的提示词</p><p class="empty-hint">换一个分类或关键词，也可以关掉上方的筛选。</p></div>`;
    renderPager(0, 1, 1);
    return;
  }

  view.items.forEach(p=>{
    const card=document.createElement('article');
    card.className='prompt-card';
    card.tabIndex=0;
    const preview=escapeHtml(getPrimaryContent(p)).replace(/\s+/g,' ').trim();
    const scenes=p.variants.length>1?`<span class="tag">${p.variants.length} 个场景</span>`:'';
    const tags=(p.tags||[]).map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join('');
    card.innerHTML=`
      <div class="card-head">
        <h3 class="card-title" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</h3>
        <button class="card-copy" type="button" title="复制默认提示词" aria-label="复制默认提示词">${COPY_ICON}</button>
      </div>
      <p class="preview">${preview}</p>
      <div class="meta">
        ${tags||`<span class="tag">${escapeHtml(getCategory(p.categoryId)?.name||'未分类')}</span>`}
        ${scenes}
        <button class="fav ${p.favorite?'on':''}" type="button" title="${p.favorite?'取消收藏':'收藏'}" aria-label="${p.favorite?'取消收藏':'收藏'}" aria-pressed="${p.favorite?'true':'false'}">${STAR_ICON}</button>
      </div>`;
    const open=()=>openPrompt(p.id);
    card.onclick=(e)=>{
      if(e.target.closest('.card-copy')||e.target.closest('.fav')) return;
      open();
    };
    card.onkeydown=(e)=>{
      if(e.target.closest('.card-copy')||e.target.closest('.fav')) return;
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        open();
      }
    };
    card.querySelector('.card-copy').onclick=async(e)=>{
      e.stopPropagation();
      const previous=p.useCount||0;
      p.useCount=previous+1;
      let counted=true;
      try{
        await saveData();
      }catch(err){
        p.useCount=previous;
        counted=false;
      }
      await copyText(getPrimaryContent(p));
      showToast(counted?'已复制':'已复制，次数未保存');
    };
    card.querySelector('.fav').onclick=async(e)=>{
      e.stopPropagation();
      const previousFavorite=p.favorite;
      const previousUpdated=p.updatedAt;
      p.favorite=!p.favorite;
      p.updatedAt=Date.now();
      try{
        await saveData();
      }catch(err){
        p.favorite=previousFavorite;
        p.updatedAt=previousUpdated;
      }
      renderPrompts();
      renderCategories();
    };
    els.promptGrid.appendChild(card);
  });
  renderPager(items.length, view.page, view.pages);
}
function renderAll(){
  renderCategories();
  renderCategoryOptions();
  renderPrompts();
}

function renderVariantTabs(){
  els.variantTabs.innerHTML='';
  if(!temporaryPrompt) return;

  temporaryPrompt.variants.forEach(v=>{
    const chip=document.createElement('button');
    chip.type='button';
    chip.className='variant-chip'+(v.id===activeVariantId?' active':'');
    chip.title='点击切换，双击重命名';
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', v.id===activeVariantId ? 'true' : 'false');
    chip.innerHTML=`<span>${escapeHtml(v.name)}</span><span class="variant-chip-x" title="删除这个场景">×</span>`;

    chip.onclick=(e)=>{
      if(e.target.closest('.variant-chip-x')) return;
      switchVariant(v.id);
    };
    chip.ondblclick=async(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const name=await askText('修改标签名称',v.name);
      if(!name?.trim()) return;
      v.name=name.trim();
      renderVariantTabs();
      updateDirtyState();
    };
    chip.querySelector('.variant-chip-x').onclick=async(e)=>{
      e.stopPropagation();
      e.preventDefault();
      if(!temporaryPrompt||temporaryPrompt.variants.length<=1){
        showToast('至少保留一个提示词');
        return;
      }
      const ok=await askConfirm('删除标签',`确定删除「${v.name}」吗？`,'删除',true);
      if(!ok) return;
      removeVariant(v.id);
    };
    els.variantTabs.appendChild(chip);
  });
}
function switchVariant(id){
  if(id===activeVariantId) return;
  commitEditor();
  activeVariantId=id;
  const v=getActiveVariant();
  els.promptEditor.value=v?.content||'';
  renderVariantTabs();
  updateDirtyState();
}
function addVariant(){
  commitEditor();
  const index=temporaryPrompt.variants.length+1;
  const v={id:makeId(),name:`提示词 ${index}`,content:''};
  temporaryPrompt.variants.push(v);
  activeVariantId=v.id;
  els.promptEditor.value='';
  renderVariantTabs();
  updateDirtyState();
  requestAnimationFrame(()=>{
    const active=els.variantTabs.querySelector('.variant-chip.active');
    active?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
    els.promptEditor.focus();
  });
  showToast(`已添加 ${v.name}`);
}
function removeVariant(id){
  if(!temporaryPrompt || temporaryPrompt.variants.length<=1){
    showToast('至少保留一个提示词');
    return;
  }
  commitEditor();

  const idx=temporaryPrompt.variants.findIndex(v=>v.id===id);
  if(idx<0) return;
  temporaryPrompt.variants.splice(idx,1);

  if(activeVariantId===id){
    const next=temporaryPrompt.variants[Math.min(idx,temporaryPrompt.variants.length-1)];
    activeVariantId=next.id;
    els.promptEditor.value=next.content;
  }
  renderVariantTabs();
  updateDirtyState();
}

let lastActiveElement = null;

function openPrompt(id){
  const original=state.prompts.find(p=>p.id===id);
  if(!original) return;
  lastActiveElement=document.activeElement;
  currentPromptId=id;
  temporaryPrompt=structuredClone(normalizePrompt(original));
  activeVariantId=temporaryPrompt.variants[0].id;
  editMode=false;
  newPromptBaseline=null;
  syncModal();
  els.detailOverlay.classList.add('open');
  setTimeout(()=>els.promptEditor.focus(),40);
}
function openNewPrompt(){
  lastActiveElement=document.activeElement;
  currentPromptId='__new__';
  temporaryPrompt={
    id:makeId(),
    title:'新建提示词',
    categoryId:state.categories.find(c=>c.id!=='all'&&c.id!=='__uncategorized__')?.id||'',
    variants:[{id:makeId(),name:'默认',content:''}],
    favorite:false,
    createdAt:Date.now(),
    updatedAt:Date.now(),
    useCount:0
  };
  activeVariantId=temporaryPrompt.variants[0].id;
  editMode=true;
  newPromptBaseline={
    title:'新建提示词',
    categoryId:temporaryPrompt.categoryId,
    variantId:temporaryPrompt.variants[0].id
  };
  syncModal();
  els.detailOverlay.classList.add('open');
  setTimeout(()=>{els.titleInput.focus();els.titleInput.select();},40);
}
function setEditChrome(){
  document.querySelector('#detailOverlay .modal').classList.toggle('is-editing', editMode);
  els.editModeBtn.classList.toggle('active', editMode);
  els.editModeBtn.textContent=editMode?'编辑中':'编辑';
  els.editModeBtn.title=editMode?'再点一次取消编辑':'修改原始提示词，保存后生效';
}
function syncModal(){
  if(temporaryPrompt && !state.categories.some(c=>c.id===temporaryPrompt.categoryId)){
    temporaryPrompt.categoryId='';
  }
  renderCategoryOptions();
  els.titleInput.value=temporaryPrompt.title;
  els.categorySelect.value=temporaryPrompt.categoryId||'';
  els.titleInput.readOnly=!editMode;
  els.categorySelect.disabled=!editMode;
  els.promptEditor.readOnly=false;
  els.promptEditor.setAttribute('aria-label',editMode?'编辑原始提示词':'临时编辑提示词');
  els.promptEditor.title=editMode?'点击保存后更新提示词库':'临时修改仅用于本次复制，不会更新提示词库';
  els.deleteBtn.hidden=currentPromptId==='__new__';
  setEditChrome();

  const active=getActiveVariant()||temporaryPrompt.variants[0];
  activeVariantId=active.id;
  els.promptEditor.value=active.content;

  renderVariantTabs();
  updateDirtyState();
}
function enterEditMode(){
  if(editMode) return;
  commitEditor();
  editMode=true;
  els.titleInput.readOnly=false;
  els.categorySelect.disabled=false;
  els.promptEditor.readOnly=false;
  els.promptEditor.setAttribute('aria-label','编辑原始提示词');
  els.promptEditor.title='点击保存后更新提示词库';
  setEditChrome();
  updateDirtyState();
}
function exitEditMode(){
  editMode=false;
  els.promptEditor.readOnly=false;
  if(currentPromptId==='__new__'){
    const base=newPromptBaseline||{
      title:'新建提示词',
      categoryId:temporaryPrompt.categoryId,
      variantId:temporaryPrompt.variants[0]?.id
    };
    temporaryPrompt={
      ...temporaryPrompt,
      title:base.title,
      categoryId:base.categoryId,
      variants:[{id:base.variantId||makeId(),name:'默认',content:''}]
    };
    activeVariantId=temporaryPrompt.variants[0].id;
  }else{
    const original=state.prompts.find(p=>p.id===currentPromptId);
    if(!original) return;
    temporaryPrompt=structuredClone(normalizePrompt(original));
    activeVariantId=temporaryPrompt.variants[0].id;
  }
  syncModal();
  showToast('已取消编辑');
}
function toggleEditMode(){
  if(editMode) exitEditMode();
  else enterEditMode();
}
function comparablePrompt(p){
  const q=normalizePrompt(structuredClone(p));
  return {
    title:(q.title||'').trim(),
    categoryId:q.categoryId,
    variants:q.variants.map(v=>({
      id:v.id,
      name:v.name.trim(),
      content:v.content
    }))
  };
}
function currentComparable(){
  commitEditor();
  temporaryPrompt.title=els.titleInput.value.trim()||'未命名提示词';
  temporaryPrompt.categoryId=els.categorySelect.value;
  return comparablePrompt(temporaryPrompt);
}
function originalComparable(){
  if(currentPromptId==='__new__'){
    return {
      title:'新建提示词',
      categoryId:newPromptBaseline?.categoryId || '',
      variants:[{id:newPromptBaseline?.variantId||temporaryPrompt.variants[0].id,name:'默认',content:''}]
    };
  }
  const original=state.prompts.find(p=>p.id===currentPromptId);
  return original?comparablePrompt(original):null;
}
function hasPersistentChanges(){
  const a=currentComparable();
  const b=originalComparable();
  return !b||JSON.stringify(a)!==JSON.stringify(b);
}
function updateDirtyState(){
  if(!temporaryPrompt) return;
  els.saveBtn.hidden=!(editMode&&hasPersistentChanges());
}
let promptSaving=false;
async function savePrompt(){
  if(!editMode||promptSaving) return;
  promptSaving=true;
  try{
    currentComparable();
    temporaryPrompt.updatedAt=Date.now();
    const wasNew=currentPromptId==='__new__';
    const promptCopy=structuredClone(temporaryPrompt);
    const savedId=promptCopy.id;
    let previousPrompt=null;
    if(wasNew){
      state.prompts.push(structuredClone(promptCopy));
      currentPromptId=savedId;
    }else{
      const idx=state.prompts.findIndex(p=>p.id===savedId);
      if(idx>=0){
        previousPrompt=state.prompts[idx];
        state.prompts[idx]=structuredClone(promptCopy);
      }
    }
    try{
      await saveData();
    }catch(e){
      if(wasNew){
        state.prompts=state.prompts.filter(p=>p.id!==savedId);
        if(currentPromptId===savedId) currentPromptId='__new__';
      }else if(previousPrompt){
        const idx=state.prompts.findIndex(p=>p.id===savedId);
        if(idx>=0) state.prompts[idx]=previousPrompt;
      }
      renderAll();
      return;
    }
    renderAll();
    // 保存期间可能继续输入、切换场景或关闭详情；只更新仍属于本次保存的编辑器。
    if(currentPromptId!==savedId||!temporaryPrompt) return;
    const changed=JSON.stringify(currentComparable())!==JSON.stringify(comparablePrompt(promptCopy));
    if(changed){
      editMode=true;
      updateDirtyState();
      showToast('已保存，后续修改尚未保存');
      return;
    }
    temporaryPrompt=structuredClone(state.prompts.find(p=>p.id===savedId));
    activeVariantId=temporaryPrompt.variants.find(v=>v.id===activeVariantId)?.id || temporaryPrompt.variants[0].id;
    editMode=false;
    syncModal();
    showToast('已保存');
  }finally{
    promptSaving=false;
  }
}
function restorePrompt(){
  if(currentPromptId==='__new__'){
    const base=newPromptBaseline||{title:'新建提示词',categoryId:'',variantId:temporaryPrompt.variants[0]?.id};
    temporaryPrompt={
      ...temporaryPrompt,
      title:base.title,
      categoryId:base.categoryId,
      variants:[{id:base.variantId||makeId(),name:'默认',content:''}]
    };
    activeVariantId=temporaryPrompt.variants[0].id;
    syncModal();
    showToast('已恢复');
    return;
  }
  const original=state.prompts.find(p=>p.id===currentPromptId);
  if(!original) return;
  temporaryPrompt=structuredClone(normalizePrompt(original));
  activeVariantId=temporaryPrompt.variants[0].id;
  syncModal();
  showToast('已恢复');
}
function closeModal(){
  els.detailOverlay.classList.remove('open');
  currentPromptId=null;
  temporaryPrompt=null;
  activeVariantId=null;
  editMode=false;
  if(lastActiveElement && typeof lastActiveElement.focus === 'function'){
    lastActiveElement.focus();
  }
  lastActiveElement=null;
}
async function safeCloseModal(){
  if(editMode && hasPersistentChanges()){
    const ok=await askConfirm('放弃修改','当前有未保存的修改，确定退出吗？','放弃修改',true);
    if(!ok) return;
  }
  closeModal();
}
async function copyCurrent(){
  commitEditor();
  const v=getActiveVariant();
  let counted=true;
  if(currentPromptId && currentPromptId !== '__new__'){
    const p=state.prompts.find(x=>x.id===currentPromptId);
    if(p){
      const previous=p.useCount||0;
      p.useCount=previous+1;
      try{
        await saveData();
        if(temporaryPrompt) temporaryPrompt.useCount=p.useCount;
      }catch(err){
        p.useCount=previous;
        counted=false;
      }
    }
  }
  await copyText(v?.content||'');
  showToast(counted?'已复制当前提示词':'已复制，次数未保存');
}

document.getElementById('newPromptBtn').onclick=openNewPrompt;
document.getElementById('closeModalBtn').onclick=safeCloseModal;
els.detailOverlay.addEventListener('mousedown',e=>{
  if(e.target===els.detailOverlay) safeCloseModal();
});
els.editModeBtn.onclick=toggleEditMode;
els.restoreBtn.onclick=restorePrompt;
els.saveBtn.onclick=savePrompt;
els.copyBtn.onclick=copyCurrent;
els.addVariantBtn.onclick=addVariant;

els.titleInput.addEventListener('input',()=>{
  if(editMode) updateDirtyState();
});
els.categorySelect.addEventListener('change',()=>{
  if(editMode) updateDirtyState();
});
els.promptEditor.addEventListener('input',()=>{
  if(editMode) updateDirtyState();
});

els.deleteBtn.onclick=async()=>{
  if(!currentPromptId||currentPromptId==='__new__') return;
  const p=state.prompts.find(x=>x.id===currentPromptId);
  const ok=await askConfirm('删除提示词',`确定删除「${p?.title||'该提示词'}」吗？\n删除后无法恢复。`,'删除',true);
  if(!ok) return;
  const previousPrompts=state.prompts;
  state.prompts=state.prompts.filter(x=>x.id!==currentPromptId);
  try{
    await saveData();
  }catch(e){
    state.prompts=previousPrompts;
    renderAll();
    return;
  }
  closeModal();
  renderAll();
  showToast('已删除');
};

els.searchInput.addEventListener('input',debounce(renderPrompts,150));

document.querySelectorAll('[data-sort]').forEach(btn=>{
  btn.onclick=()=>{
    sortMode=btn.dataset.sort;
    document.querySelectorAll('[data-sort]').forEach(b=>{
      const on=b===btn;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
    renderPrompts();
  };
});
document.querySelector('[data-filter="favorite"]').onclick=(e)=>{
  favoriteOnly=!favoriteOnly;
  e.currentTarget.classList.toggle('is-active', favoriteOnly);
  e.currentTarget.setAttribute('aria-pressed', favoriteOnly?'true':'false');
  renderPrompts();
};

function finishCategoryEdit(){
  isEditingCategories=false;
  categorySnapshot=null;
  categoryViewSnapshot='all';
  detachedPromptCategories=new Map();
  categoryEditDirty=false;
  els.editCategoryBtn.classList.remove('is-active');
  els.editCategoryBtn.title='编辑分类';
}
function restoreCategoryEdit(){
  if(categorySnapshot) state.categories=structuredClone(categorySnapshot);
  const valid=new Set(state.categories.map(c=>c.id));
  for(const prompt of state.prompts){
    if(detachedPromptCategories.has(prompt.id)) prompt.categoryId=detachedPromptCategories.get(prompt.id);
    if(prompt.categoryId&&!valid.has(prompt.categoryId)) prompt.categoryId='';
  }
  if(temporaryPrompt){
    if(detachedPromptCategories.has(temporaryPrompt.id)) temporaryPrompt.categoryId=detachedPromptCategories.get(temporaryPrompt.id);
    if(temporaryPrompt.categoryId&&!valid.has(temporaryPrompt.categoryId)) temporaryPrompt.categoryId='';
  }
  currentCategory=categoryViewSnapshot;
  if(currentCategory!=='all'&&currentCategory!=='__uncategorized__'&&!valid.has(currentCategory)) currentCategory='all';
}
els.editCategoryBtn.onclick=async()=>{
  if(!isEditingCategories){
    isEditingCategories=true;
    categorySnapshot=structuredClone(state.categories);
    categoryViewSnapshot=currentCategory;
    detachedPromptCategories=new Map();
    categoryEditDirty=false;
    els.editCategoryBtn.classList.add('is-active');
    els.editCategoryBtn.title='退出并保存分类编辑';
    renderCategories();
    return;
  }
  if(categoryEditDirty){
    const ok=await askConfirm('保存分类','是否保存当前的分类排序与修改？','保存');
    if(!ok){
      restoreCategoryEdit();
      showToast('已取消编辑');
    }else{
      try{
        await saveData({commitCategoryEdit:true});
      }catch(e){
        return;
      }
      showToast('已保存分类修改');
    }
  }
  finishCategoryEdit();
  renderAll();
  if(temporaryPrompt) syncModal();
};

document.getElementById('addCategoryBtn').onclick=async()=>{
  const name=await askText('新建分类','');
  if(!name?.trim()) return;
  const created={id:'cat_'+Date.now(),name:name.trim()};
  state.categories.push(created);
  if(isEditingCategories){
    categoryEditDirty=true;
    renderAll();
    showToast('已新建分类');
    return;
  }
  try{
    await saveData();
  }catch(e){
    state.categories=state.categories.filter(c=>c.id!==created.id);
    renderAll();
    return;
  }
  renderAll();
  showToast('已新建分类');
};

document.getElementById('exportBtn').onclick=async()=>{
  if(!persistEnabled){
    showToast('读取失败，未导出');
    return;
  }
  const json=JSON.stringify(state,null,2);
  if(isDesktop()){
    try{
      const saved=await invoke('save_backup',{json});
      if(saved) showToast('已导出');
    }catch(err){
      showToast('导出失败');
    }
    return;
  }
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='CueVault-backup.json';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async(e)=>{
  const file=e.target.files[0];
  if(!file) return;
  try{
    if(!persistEnabled){
      showToast('读取失败，未导入');
      return;
    }
    let rawParsed;
    try{
      rawParsed=JSON.parse(await file.text());
    }catch(err){
      await askConfirm('导入失败','所选文件不是合法的 JSON 格式，无法解析。','知道了');
      return;
    }
    const imported=normalizeImport(rawParsed);
    if(imported.error){
      await askConfirm('导入失败',imported.error,'知道了');
      return;
    }
    const next={
      categories:imported.keepCategories?structuredClone(state.categories):imported.categories,
      prompts:imported.prompts
    };
    const problem=validateLibrary(next);
    if(problem){
      await askConfirm('导入失败',problem,'知道了');
      return;
    }
    const realCats=next.categories.filter(c=>c.id!=='all').length;
    const message=imported.keepCategories
      ? `即将导入 ${next.prompts.length} 条提示词，并保留当前分类。现有提示词会被替换。`
      : `即将用文件中的 ${next.prompts.length} 条提示词和 ${realCats} 个分类覆盖当前提示词库。`;
    const ok=await askConfirm('导入数据',message,'继续导入',true);
    if(!ok) return;
    const previous=structuredClone(state);
    const previousCategory=currentCategory;
    state=next;
    currentCategory='all';
    try{
      await saveData({commitCategoryEdit:true});
    }catch(err){
      state=previous;
      currentCategory=previousCategory;
      renderAll();
      return;
    }
    finishCategoryEdit();
    if(temporaryPrompt) closeModal();
    renderAll();
    showToast('导入完成');
  }finally{
    e.target.value='';
  }
};

document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;

  if(mod&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    els.searchInput.focus();
    els.searchInput.select();
  }

  if(els.appDialogOverlay.classList.contains('open')){
    if(e.key==='Escape'){
      e.preventDefault();
      closeAppDialog(null);
    }
    return;
  }

  if(els.detailOverlay.classList.contains('open')){
    if(e.key==='Escape'){
      e.preventDefault();
      safeCloseModal();
    }
    if(mod&&e.key.toLowerCase()==='e'){
      e.preventDefault();
      toggleEditMode();
    }
    if(mod&&e.key.toLowerCase()==='s'&&editMode&&hasPersistentChanges()){
      e.preventDefault();
      savePrompt();
    }
    if(mod&&e.key==='Enter'){
      e.preventDefault();
      copyCurrent();
    }
  }
});

function applyTheme(theme){
  const dark=theme==='dark';
  document.documentElement.dataset.theme=dark?'dark':'light';
  const btn=document.getElementById('themeToggle');
  btn.textContent=dark?'深色':'浅色';
  btn.setAttribute('aria-pressed',dark?'true':'false');
  btn.title=dark?'切换为浅色':'切换为深色';
  const value=dark?'dark':'light';
  if(isDesktop()) invoke('set_setting',{key:'theme',value}).catch(()=>{});
  else localStorage.setItem(THEME_KEY,value);
}
async function readStoredTheme(){
  if(isDesktop()){
    const value=await invoke('get_setting',{key:'theme'});
    return value==='dark'?'dark':'light';
  }
  return localStorage.getItem(THEME_KEY)==='dark'?'dark':'light';
}
document.getElementById('themeToggle').onclick=()=>{
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
};

const kbd=document.querySelector('.kbd');
if(kbd && !/Mac|iPhone|iPad/.test(navigator.userAgent)) kbd.textContent='Ctrl K';

async function bindCloseFlush(){
  if(!isDesktop()) return;
  const getWin=window.__TAURI__?.window?.getCurrentWindow;
  if(typeof getWin!=='function') return;
  const win=getWin();
  let closing=false;
  let unlisten=null;
  unlisten=await win.onCloseRequested(async(event)=>{
    event.preventDefault();
    if(closing) return;
    closing=true;
    try{
      if(persistEnabled) await saveData({commitCategoryEdit:isEditingCategories&&categoryEditDirty});
    }catch(e){
      closing=false;
      showToast('保存失败，窗口已保留，请重试保存后关闭',4000);
      return;
    }
    try{
      await win.destroy();
      if(typeof unlisten==='function') await unlisten();
      unlisten=null;
    }catch(e){
      closing=false;
      showToast('关闭失败，请重试',4000);
    }
  });
}
async function boot(){
  try{
    state=await loadData();
  }catch(err){
    console.error(err);
    persistEnabled=false;
    state=structuredClone(seedData);
    showToast('读取失败，这次打开不会写入',4000);
  }
  let theme='light';
  try{ theme=await readStoredTheme(); }catch(e){}
  applyTheme(theme);
  renderAll();
  try{ await bindCloseFlush(); }catch(e){}
}
boot();
</script>
